name: Apply PittCo intelligence v1
on:
  push:
    paths: ['intel-v1-trigger.txt']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install intelligence scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('home-v3.html'); t=p.read_text()
          tag='<script src="pittco-intelligence-v1.js"></script><script src="home-intel-v1.js"></script>'
          if 'home-intel-v1.js' not in t: t=t.replace('</body>',tag+'</body>')
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "PittCo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add home-v3.html
          git diff --cached --quiet || git commit -m "Launch Today Game Plan and Pattern Memory"
          git push