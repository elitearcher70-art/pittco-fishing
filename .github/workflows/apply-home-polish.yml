name: Apply home polish
on:
  push:
    paths:
      - 'home-polish-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline polished home CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path('home-v3.html')
          css = Path('home-polish-v1.css').read_text()
          text = home.read_text()
          marker = '/* PITTCO_HOME_POLISH_V1 */'
          block = marker + '\n' + css
          if marker in text:
              start = text.index(marker)
              end = text.index('</style>', start)
              text = text[:start] + block + text[end:]
          else:
              text = text.replace('</style>', '\n' + block + '\n</style>', 1)
          home.write_text(text)
          PY
      - name: Commit home polish
        run: |
          git config user.name "PittCo Automation"
          git config user.email "actions@users.noreply.github.com"
          git add home-v3.html
          git diff --cached --quiet || git commit -m "Polish PittCo home screen appearance"
          git push
