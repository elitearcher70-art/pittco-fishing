<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030305"><title>PittCo Fishing</title><style>html,body{margin:0;background:#030305;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center}.mark{font-size:28px;font-weight:950}.mark span{color:#a427ff}.muted{color:#aaa5b2;font-size:12px;margin-top:8px}</style></head><body><div id="boot"><div><div class="mark">PITTCO <span>FISHING</span></div><div class="muted">Loading crisp home…</div></div></div><script>const RAW='https://raw.githubusercontent.com/elitearcher70-art/pittco-fishing/main/';async function boot(){try{let html=await fetch(RAW+'release-home-base.html?v=hd3',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const hd=`<script>(function(){async function loadPittCoHdHero(){try{const base='https://raw.githubusercontent.com/elitearcher70-art/pittco-fishing/main/assets/hero-avif/';const names=['00','01','02a','02b','03a','03b','04','05'];const parts=await Promise.all(names.map(n=>fetch(base+n+'.txt?v=3',{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));const src='data:image/avif;base64,'+parts.join('');const hero=document.querySelector('.hero');if(!hero)return;const im=new Image();im.onload=()=>{hero.style.backgroundImage='url("'+src+'")';hero.dataset.hd='ready'};im.src=src}catch(e){console.warn('HD hero fallback',e)}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',loadPittCoHdHero,{once:true});else loadPittCoHdHero()})();<\/script>`;html=html.replace('</head>',hd+'</head>');document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><div class="mark">PITTCO <span>FISHING</span></div><div class="muted">Unable to load Home. Refresh and try again.</div></div>';console.error(e)}}boot();</script></body></html>
