<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040406"><title>PittCo Fishing</title><style>html,body{margin:0;background:#040406;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center}.bootMark{font-size:28px;font-weight:950}.bootMark span{color:#a427ff}.muted{color:#aaa5b2;font-size:12px;margin-top:10px}</style></head><body><div id="boot"><div><div class="bootMark">PITTCO <span>FISHING</span></div><div class="muted">Loading PittCo Fishing…</div></div></div><script>
const RAW='https://raw.githubusercontent.com/elitearcher70-art/pittco-fishing/main/';
const HOME='home-v3.html';
const ALLOWED=[HOME,'legacy.html','lake-directory.html','lake-profile.html','community.html','settings.html','profile.html','more.html','more-v2.html','merch.html','help.html','weather.html','map.html'];
const USACE={'ok-sardis':'SARD','ok-eufaula':'EUFA','ok-broken-bow':'BROK','ok-tenkiller':'TENK'};
const AUTH={'ok-grand':{label:'GRDA River Operations',url:'https://stormops.grda.com/riveroperations'},'ok-hudson':{label:'GRDA River Operations',url:'https://stormops.grda.com/riveroperations'},'ok-mcgee-creek':{label:'Bureau of Reclamation',url:'https://www.usbr.gov/projects/index.php?id=351'}};
function parseRoute(v){v=decodeURIComponent(v||HOME);let hash=v.includes('#')?'#'+v.split('#').slice(1).join('#'):'',beforeHash=v.split('#')[0],search=beforeHash.includes('?')?'?'+beforeHash.split('?').slice(1).join('?'):'',file=beforeHash.split('?')[0].replace(/^\.\//,'').replace(/^\//,'');if(!ALLOWED.includes(file))file=HOME;return{file,search,hash}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stat(label,value,cls=''){if(value==null||value==='')return'';return '<div class="stat"><b class="'+cls+'">'+esc(value)+'</b><small>'+esc(label)+'</small></div>'}
function fmt(n,d=0){const x=Number(n);return Number.isFinite(x)?x.toLocaleString(undefined,{maximumFractionDigits:d}):'—'}
function rewriteLinks(h){return h.replaceAll('href="home-v3.html"','href="/"').replaceAll('href="lake-directory.html"','href="/?route=lake-directory.html"').replaceAll('href="community.html"','href="/?route=community.html"').replaceAll('href="profile.html"','href="/?route=profile.html"').replaceAll('href="settings.html"','href="/?route=settings.html"').replaceAll('href="more.html"','href="/?route=more.html"').replaceAll('href="legacy.html#catches"','href="/?route=legacy.html%23catches"').replaceAll('href="legacy.html#trips"','href="/?route=legacy.html%23trips"').replaceAll('href="legacy.html#gear"','href="/?route=legacy.html%23gear"').replaceAll('href="legacy.html#tourneys"','href="/?route=legacy.html%23tourneys"').replaceAll('href="legacy.html#lakes"','href="/?route=map.html"').replaceAll('href="legacy.html"','href="/?route=legacy.html"')}
function rewriteFetches(h){return h.replaceAll("fetch('/data/lakes.json'","fetch('"+RAW+"data/lakes.json'").replaceAll('fetch(\"/data/lakes.json\"','fetch(\"'+RAW+'data/lakes.json\"').replaceAll("fetch('/data/app-config.json'","fetch('"+RAW+"data/app-config.json'")}
function timeoutFetch(url,opts={},ms=5500){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,Object.assign({},opts,{signal:c.signal})).finally(()=>clearTimeout(t))}
async function json(url,opts){const r=await timeoutFetch(url,opts||{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
async function series(name,unit){const q=new URLSearchParams({name,office:'SWT',begin:'PT-30H',timezone:'America/Chicago',format:'json','page-size':'80',unit});const j=await json('https://cwms-data.usace.army.mil/cwms-data/timeseries?'+q,{cache:'no-store',headers:{Accept:'application/json;version=2'}});return (j.values||[]).filter(v=>Array.isArray(v)&&v[1]!=null&&Number.isFinite(Number(v[1]))).map(v=>[Number(v[0]),Number(v[1])])}
function last(a){return a&&a.length?a[a.length-1]:null}
function prior24(a,t){if(!a||!a.length)return null;let target=t-86400000,b=a[0],bd=Math.abs(a[0][0]-target);for(const x of a){let d=Math.abs(x[0]-target);if(d<bd){b=x;bd=d}}return b}
async function damData(id,d){const code=USACE[id];let out='';if(d.dam_name)out+=stat('Dam',d.dam_name);if(d.normal_pool_ft!=null)out+=stat('Normal / conservation pool',Number(d.normal_pool_ft).toFixed(2)+' ft');if(!code){if(AUTH[id])out+=stat('Live operations','Use official operations source below','warn');else out+=stat('Live operations','Not available yet','warn');return{html:out,note:'Live operations are shown directly when an authoritative feed is available.'}}
let elev=[],inflow=[],release=[];try{[elev,inflow,release]=await Promise.all([series(code+'.Elev.Inst.1Hour.0.Ccp-Rev','ft').catch(()=>[]),series(code+'.Flow-Res In.Ave.1Hour.1Hour.Rev-Regi-Computed','cfs').catch(()=>[]),series(code+'.Flow-Res Out.Ave.1Hour.1Hour.Rev-Regi-Flowgroup','cfs').catch(()=>[])])}catch(e){}
const e=last(elev),i=last(inflow),o=last(release);if(e){const pool=Number(d.normal_pool_ft),delta=Number.isFinite(pool)?e[1]-pool:null,p=prior24(elev,e[0]),chg=p?e[1]-p[1]:null;out+=stat('Current lake level',e[1].toFixed(2)+' ft','good');if(delta!=null)out+=stat('Vs normal pool',(delta>=0?'+':'')+delta.toFixed(2)+' ft');if(chg!=null)out+=stat('24-hour level change',(chg>=0?'↑ ':'↓ ')+Math.abs(chg).toFixed(2)+' ft')}else out+=stat('Current lake level','Live value unavailable','warn');if(o){const r=Number(o[1]);out+=stat('Water release',r>1?'ACTIVE — RELEASING WATER':'NO MEASURABLE RELEASE',r>1?'good':'');out+=stat('Release flow',Math.round(r).toLocaleString()+' cfs')}else{out+=stat('Water release','Status unavailable','warn');out+=stat('Release flow','Live value unavailable')}if(i)out+=stat('Inflow',Math.round(i[1]).toLocaleString()+' cfs');out+=stat('Gate / spillway position','Not separately published');const ts=e?e[0]:(o?o[0]:null);return{html:out,note:'USACE Tulsa District CWMS'+(ts?' • Updated '+new Date(ts).toLocaleString():'')+'. Release status is based on measured reservoir outflow; physical gate position is not inferred.'}}
async function weatherData(x){try{const u='https://api.open-meteo.com/v1/forecast?latitude='+x.lat+'&longitude='+x.lon+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,surface_pressure,weather_code&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto',j=await json(u),c=j.current||{},p=Number(c.surface_pressure)*.02953,w=Number(c.weather_code),cond=w===0?'Sunny':w<=3?'Partly cloudy':w<=48?'Fog':w<=67?'Rain':w<=82?'Showers':'Storms';return stat('Condition',cond+' • '+Math.round(c.temperature_2m)+'°','good')+stat('Feels like',Math.round(c.apparent_temperature)+'°')+stat('Wind',Math.round(c.wind_speed_10m||0)+' mph')+stat('Humidity',Math.round(c.relative_humidity_2m||0)+'%')+stat('Pressure',Number.isFinite(p)?p.toFixed(2)+' inHg':'—')}catch(e){return stat('Live weather','Temporarily unavailable')}}
async function renderProfile(raw,p){const doc=new DOMParser().parseFromString(raw,'text/html');doc.querySelectorAll('script').forEach(s=>s.remove());const id=new URLSearchParams(p.search).get('lake');let lakes=[],intel={},bathy={};try{const a=await Promise.all([json(RAW+'data/lakes.json?v=profile-final1'),json(RAW+'data/lake-intel.json?v=profile-final1'),json(RAW+'data/ok-bathymetry.json?v=profile-final1').catch(()=>({}))]);lakes=a[0].lakes||[];intel=a[1].lakes||{};bathy=a[2].lakes||{}}catch(e){doc.getElementById('name').textContent='Lake profile unavailable';doc.getElementById('region').textContent='Lake catalog could not be loaded.';return '<!doctype html>'+doc.documentElement.outerHTML}const x=lakes.find(v=>v.id===id)||lakes[0],d=intel[x.id]||{},b=bathy[x.id]||{};doc.getElementById('name').textContent=x.name;doc.getElementById('state').textContent=x.state+' • LAKE PROFILE';doc.getElementById('region').textContent='Everything PittCo has tied to '+x.name+' in one place.';let specs='';if(d.surface_acres!=null)specs+=stat('Surface area',fmt(d.surface_acres)+' ac');if(d.shoreline_miles!=null)specs+=stat('Shoreline',fmt(d.shoreline_miles,1)+' mi');if(d.max_depth_ft!=null)specs+=stat('Max depth',fmt(d.max_depth_ft,1)+' ft');if(d.normal_pool_ft!=null)specs+=stat('Normal / conservation pool',fmt(d.normal_pool_ft,2)+' ft');if(d.volume_acre_ft!=null)specs+=stat('Volume / storage',fmt(d.volume_acre_ft)+' ac-ft');else if(d.storage_acre_ft!=null)specs+=stat('Volume / storage',fmt(d.storage_acre_ft)+' ac-ft');if(d.dam_height_ft!=null)specs+=stat('Dam height',fmt(d.dam_height_ft)+' ft');doc.getElementById('specGrid').innerHTML=specs||stat('Lake data','Still being verified');let details='<div class="section"><strong>Managing agency</strong><p>'+esc(d.manager||'Not yet verified')+'</p></div>';if(d.dam_name)details+='<div class="section"><strong>Dam</strong><p>'+esc(d.dam_name)+'</p></div>';if(d.counties&&d.counties.length)details+='<div class="section"><strong>Counties</strong><p>'+esc(d.counties.join(', '))+'</p></div>';details+='<div class="section"><strong>Depth / bathymetry</strong><p class="'+(b.status==='available'?'good':'')+'">'+(b.status==='available'?'Verified public depth contours available':'Verified depth coverage has not yet been confirmed for this lake.')+'</p></div>';if(d.fish&&d.fish.length)details+='<div class="section"><strong>Key fish</strong><div class="chips">'+d.fish.map(v=>'<span class="chip">'+esc(v)+'</span>').join('')+'</div></div>';if(d.facilities&&d.facilities.length)details+='<div class="section"><strong>Access & facilities</strong><div class="chips">'+d.facilities.map(v=>'<span class="chip">'+esc(v)+'</span>').join('')+'</div></div>';if(d.regulation_note)details+='<div class="section"><strong>Regulations</strong><p>'+esc(d.regulation_note)+'</p></div>';if(d.angler_note)details+='<div class="section"><strong>Angler notes</strong><p>'+esc(d.angler_note)+'</p></div>';doc.getElementById('details').innerHTML=details;const map='/?route='+encodeURIComponent('map.html?lake='+x.id),wx='/?route='+encodeURIComponent('weather.html?lake='+x.id);doc.getElementById('mapNav').href=map;doc.getElementById('wxNav').href=wx;let links='<a class="primary" href="'+map+'">Map + Depth + Ramps</a><a href="'+wx+'">Full Forecast</a>';if(d.official_report_url)links+='<a href="'+esc(d.official_report_url)+'" target="_blank" rel="noopener">Official Fishing Profile ↗</a>';if(d.live_water_url)links+='<a href="'+esc(d.live_water_url)+'" target="_blank" rel="noopener">Official Water ↗</a>';if(AUTH[x.id])links+='<a href="'+esc(AUTH[x.id].url)+'" target="_blank" rel="noopener">'+esc(AUTH[x.id].label)+' ↗</a>';doc.getElementById('links').innerHTML=links;const [dam,wxhtml]=await Promise.all([damData(x.id,d),weatherData(x)]);doc.getElementById('damGrid').innerHTML=dam.html;doc.getElementById('damNote').textContent=dam.note;doc.getElementById('weatherGrid').innerHTML=wxhtml;doc.getElementById('ramps').innerHTML='<p class="note">Open Map + Depth + Ramps for the complete ramp layer and mapped access records.</p>';return '<!doctype html>'+doc.documentElement.outerHTML}
async function load(){const rp=new URLSearchParams(location.search).get('route'),p=parseRoute(rp||HOME);try{const r=await fetch(RAW+p.file+'?v=20260820-final-profile1',{cache:'no-store'});if(!r.ok)throw Error(r.status);let h=await r.text();h=rewriteFetches(rewriteLinks(h));if(p.file===HOME)h=h.replace('href=\"/?route=lake-directory.html%3Flake%3D${encodeURIComponent(x.id)}\"','href=\"/?route=lake-profile.html%3Flake%3D${encodeURIComponent(x.id)}\"');if(p.file==='lake-profile.html')h=await renderProfile(h,p);else{const payload=JSON.stringify({search:p.search,hash:p.hash});h=h.replace(/<head([^>]*)>/i,'<head$1><script>window.__PITTCO_ROUTE='+payload+';window.__PITTCO_ROUTE_SEARCH=window.__PITTCO_ROUTE.search;window.__PITTCO_ROUTE_HASH=window.__PITTCO_ROUTE.hash;<\/script>');if(p.file==='map.html')h=h.replace('</body>','<script src="'+RAW+'map-depth-providers-v3.js?v=4"><\/script><script src="'+RAW+'map-bathymetry-assets-v1.js?v=3"><\/script><script src="'+RAW+'ok-depth-coverage-v1.js?v=1"><\/script></body>');if(p.file==='lake-directory.html')h=h.replace('</body>','<script src="'+RAW+'ok-depth-coverage-v1.js?v=1"><\/script><script src="'+RAW+'lake-directory-mapfix-v1.js?v=1"><\/script><script src="'+RAW+'lake-intel-v1.js?v=7"><\/script><script src="'+RAW+'lake-hub-v1.js?v=2"><\/script><script src="'+RAW+'lake-auto-profile-v1.js?v=1"><\/script></body>')}document.open();document.write(h);document.close();if(p.hash){let id=p.hash.slice(1),n=0,t=setInterval(()=>{n++;if(typeof window.go==='function'){clearInterval(t);window.go(id)}else if(n>20)clearInterval(t)},50)}}catch(e){document.getElementById('boot').innerHTML='<div><div class="bootMark">PITTCO <span>FISHING</span></div><div class="muted">Unable to load PittCo. Refresh and try again.</div></div>';console.error(e)}}load();
</script></body></html>
