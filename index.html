<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>PittCo Fishing</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--p:#a52bff;--bg:#050505;--card:#111116;--line:#31203d;--muted:#aaa8b4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#190522,#050505 35%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 96px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:1000;letter-spacing:-1.5px;text-shadow:0 0 14px #a52bff55}.brand span{color:var(--p)}.icon{width:40px;height:40px;border-radius:13px;border:1px solid #2b2b33;background:#0b0b10;color:#fff;display:grid;place-items:center}.hello{display:flex;justify-content:space-between;align-items:end;margin:18px 2px}.hello h1{margin:4px 0 0;font-size:28px}.muted{color:var(--muted);font-size:12px}.temp{font-size:27px;font-weight:900;text-align:right}.card{background:linear-gradient(145deg,#15151d,#0b0b10);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 12px 30px #0007}.weather{margin-bottom:16px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.wx{background:#09090d;border:1px solid #26262e;border-radius:14px;padding:10px 6px;text-align:center}.wx b{display:block}.wx small{color:var(--muted)}select,input,textarea{width:100%;background:#08080c;color:#fff;border:1px solid #342343;border-radius:13px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{min-height:150px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}.tile .big{font-size:30px;color:var(--p)}.tile h3{margin:7px 0 5px}.tile p{font-size:12px;color:var(--muted);margin:0}.section{font-size:17px;font-weight:900;margin:20px 3px 10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{text-align:center}.metric b{display:block;font-size:21px}.metric small{color:var(--muted)}button{font:inherit}.btn{border:0;border-radius:13px;padding:11px 13px;font-weight:900}.primary{background:linear-gradient(135deg,var(--p),#6f16c8);color:#fff}.secondary{background:#111117;color:#fff;border:1px solid #303039}.danger{background:#2b1017;color:#ffadba;border:1px solid #4a1d27}.screen{display:none}.screen.active{display:block}.entry{margin:10px 0}.entry img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px;margin-bottom:10px}.entry h3{margin:0}.entry .meta{color:var(--muted);font-size:12px;margin-top:5px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#050508ee;backdrop-filter:blur(15px);border-top:1px solid #271631;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:1000}.tabsin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.tab{background:transparent;border:0;color:#999;padding:7px 1px;font-size:9px}.tab i{font-style:normal;font-size:19px;display:block}.tab.active{color:var(--p);background:#170c20;border-radius:12px}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:2000;padding:14px;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(760px,100%);margin:auto;background:#0b0b10;border:1px solid #4a2a60;border-radius:23px;padding:17px;max-height:90vh;overflow:auto}.field{margin:11px 0}.field label{font-size:12px;color:#cbc9d0;display:block;margin-bottom:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}#mapbox{height:430px;border-radius:18px;overflow:hidden;border:1px solid #3c214d}.lakebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.lakebtn{background:#0d0d13;color:#fff;border:1px solid #31203d;border-radius:13px;padding:11px;text-align:left}.empty{text-align:center;color:var(--muted);padding:28px}.photoPrev{display:none;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin-top:8px}@media(max-width:390px){.wxgrid{grid-template-columns:1fr 1fr}.lakebtns{grid-template-columns:1fr}}</style></head><body><div class="app"><section id="home" class="screen active"></section><section id="catches" class="screen"></section><section id="trips" class="screen"></section><section id="gear" class="screen"></section><section id="tourneys" class="screen"></section><section id="lakes" class="screen"></section></div><nav class="tabs"><div class="tabsin"><button class="tab active" data-go="home"><i>⌂</i>HOME</button><button class="tab" data-go="catches"><i>🐟</i>CATCH</button><button class="tab" data-go="trips"><i>▤</i>TRIPS</button><button class="tab" data-go="gear"><i>▣</i>TACKLE</button><button class="tab" data-go="tourneys"><i>🏆</i>TOURNEYS</button><button class="tab" data-go="lakes"><i>⌖</i>LAKES</button></div></nav><div id="modal" class="modal"><div class="sheet"><h2 id="mt">Add</h2><div id="fields"></div><div class="actions"><button class="btn secondary" onclick="closeForm()">Cancel</button><button class="btn primary" onclick="saveForm()">Save</button></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const KEY='pittco-v4',lakes=[['Sardis Lake',34.6443,-95.3694],['McGee Creek Reservoir',34.3245,-95.8753],['Lake Eufaula',35.2873,-95.5822],['Broken Bow Lake',34.1401,-94.6948]];let data=JSON.parse(localStorage.getItem(KEY)||'{"catches":[],"trips":[],"gear":[],"tourneys":[]}'),lake=lakes[0],form=null,pic='',map=null,weather='';const e=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function brand(){return '<div class="top"><div class="icon">☰</div><div class="brand">PITTCO <span>FISHING</span></div><div class="icon">◉</div></div>'}function weatherCard(){return `<div class="card weather"><div class="row between"><div><b id="wxlake">${e(lake[0])}</b><div class="muted" id="cond">Loading live weather…</div></div><select id="ls">${lakes.map(x=>`<option ${x[0]==lake[0]?'selected':''}>${x[0]}</option>`).join('')}</select></div><div class="wxgrid"><div class="wx"><b id="wt">--</b><small>TEMP</small></div><div class="wx"><b id="ww">--</b><small>WIND</small></div><div class="wx"><b id="wh">--</b><small>HUMIDITY</small></div><div class="wx"><b id="wr">--</b><small>RAIN</small></div></div></div>`}function home(){let best=data.catches.length?Math.max(...data.catches.map(x=>+x.weight||0)).toFixed(2):'0.00';return `${brand()}<div class="hello"><div><div class="muted">Good evening,</div><h1>PittCo Angler</h1></div><div><div class="temp" id="mini">--</div><div class="muted" id="minic">Weather</div></div></div>${weatherCard()}<div class="metrics"><div class="card metric"><b>${data.catches.length}</b><small>CATCHES</small></div><div class="card metric"><b>${best}</b><small>BEST LB</small></div><div class="card metric"><b>${data.trips.length}</b><small>TRIPS</small></div></div><div class="section">Your Fishing Hub</div><div class="grid">${[['catches','🐟','CATCH LOG','Photos, weight, lure and lake.'],['trips','▤','TRIP JOURNAL','Conditions, notes and memories.'],['gear','▣','TACKLE LOCKER','Rods, reels and setups.'],['tourneys','🏆','TOURNAMENT HUB','Dates, entries and results.'],['lakes','⌖','LAKE MAP','Map and live lake weather.']].map(x=>`<button class="card tile" data-go="${x[0]}"><div class="big">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></button>`).join('')}</div>`}function page(title,sub){return brand()+`<h1>${title}</h1><div class="muted">${sub}</div>`}function list(type,title,sub,fn){let a=data[type];return page(title,sub)+`<div class="row between" style="margin:14px 0"><span class="muted">${a.length} saved</span><button class="btn primary" data-add="${type}">+ Add</button></div>`+(a.length?a.map(fn).join(''):'<div class="card empty">Nothing logged yet.</div>')}function catchCard(x){return `<div class="card entry">${x.photo?`<img src="${x.photo}">`:''}<div class="row between"><h3>${e(x.weight)} lb ${e(x.species||'Bass')}</h3><b style="color:#d7a2ff">${e(x.lake)}</b></div><div class="meta">${e(x.lure)} • ${e(x.depth)} ft • ${e(x.area)}</div><div class="meta">${e(x.date)} ${x.weather?'• '+e(x.weather):''}</div><button class="btn danger" data-del="catches" data-id="${x.id}" style="margin-top:10px">Delete</button></div>`}function simpleCard(x,type){return `<div class="card entry"><h3>${e(x.name||x.lake||'Entry')}</h3><div class="meta">${e(x.detail||x.note||x.setup||x.date||'')}</div><button class="btn danger" data-del="${type}" data-id="${x.id}" style="margin-top:10px">Delete</button></div>`}function lakePage(){return page('Fishing Spots','Tap a lake to center the map and update live weather.')+`<div class="card" style="margin-top:15px;padding:7px"><div id="mapbox"></div></div><div class="lakebtns">${lakes.map(x=>`<button class="lakebtn" data-lake="${x[0]}"><b>${x[0]}</b><div class="muted">Oklahoma</div></button>`).join('')}</div><div style="margin-top:12px">${weatherCard()}</div>`}function render(){homeEl.innerHTML=home();catches.innerHTML=list('catches','Catch Log','Save catch photos and conditions.',catchCard);trips.innerHTML=list('trips','Trip Journal','Remember what worked.',x=>simpleCard(x,'trips'));gear.innerHTML=list('gear','Tackle Locker','Keep your setups organized.',x=>simpleCard(x,'gear'));tourneys.innerHTML=list('tourneys','Tournament Hub','Track upcoming events.',x=>simpleCard(x,'tourneys'));lakesEl.innerHTML=lakePage();wire();setTimeout(()=>fetchWx(),20)}const homeEl=document.getElementById('home'),catches=document.getElementById('catches'),trips=document.getElementById('trips'),gear=document.getElementById('gear'),tourneys=document.getElementById('tourneys'),lakesEl=document.getElementById('lakes');function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this entry?')){data[b.dataset.del]=data[b.dataset.del].filter(x=>x.id!=b.dataset.id);save()}});document.querySelectorAll('[data-lake]').forEach(b=>b.onclick=()=>{lake=lakes.find(x=>x[0]==b.dataset.lake)||lake;render();go('lakes')});document.querySelectorAll('#ls').forEach(s=>s.onchange=()=>{lake=lakes.find(x=>x[0]==s.value)||lake;fetchWx()})}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.go==id));if(id=='lakes')setTimeout(initMap,50);if(id=='home'||id=='lakes')setTimeout(fetchWx,50)}function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}async function fetchWx(){try{let [n,lat,lon]=lake,u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=precipitation_probability&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1`,j=await(await fetch(u)).json(),c=j.current||{},rain='--',i=j.hourly?.time?.indexOf(c.time);if(i>=0)rain=j.hourly.precipitation_probability[i];let ct={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorms'}[c.weather_code]||'Current conditions';document.querySelectorAll('#wxlake').forEach(x=>x.textContent=n);document.querySelectorAll('#cond').forEach(x=>x.textContent=ct);document.querySelectorAll('#wt').forEach(x=>x.textContent=Math.round(c.temperature_2m)+'°F');document.querySelectorAll('#ww').forEach(x=>x.textContent=Math.round(c.wind_speed_10m)+' mph');document.querySelectorAll('#wh').forEach(x=>x.textContent=Math.round(c.relative_humidity_2m)+'%');document.querySelectorAll('#wr').forEach(x=>x.textContent=rain+'%');document.querySelectorAll('#mini').forEach(x=>x.textContent=Math.round(c.temperature_2m)+'°F');document.querySelectorAll('#minic').forEach(x=>x.textContent=ct+' • '+n);weather=`${Math.round(c.temperature_2m)}°F, ${ct}, wind ${Math.round(c.wind_speed_10m)} mph`}catch{document.querySelectorAll('#cond').forEach(x=>x.textContent='Weather unavailable')}}function initMap(){if(map){map.remove();map=null}let el=document.getElementById('mapbox');if(!el)return;map=L.map(el).setView([34.7,-95.4],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);lakes.forEach(x=>L.marker([x[1],x[2]]).addTo(map).bindPopup(`<b>${x[0]}</b>`).on('click',()=>{lake=x;fetchWx()}));setTimeout(()=>map.invalidateSize(),100)}const schema={catches:[['lake','Lake','lake'],['species','Species','Largemouth Bass'],['weight','Weight (lb)','5.42'],['lure','Lure','Football jig'],['depth','Depth (ft)','12'],['area','Area / structure','Main-lake point'],['date','Date','date'],['photo','Catch photo','file']],trips:[['lake','Lake','lake'],['date','Date','date'],['detail','Trip summary','8 fish, best 4.8 lb']],gear:[['name','Gear name','Dobyns 704C'],['detail','Setup / use','Jigs and Texas rigs']],tourneys:[['name','Tournament','Sunday Jackpot'],['lake','Lake','lake'],['date','Date','date'],['detail','Entry / notes','$50 entry']]};function openForm(type){form=type;pic='';mt.textContent='Add '+({catches:'Catch',trips:'Trip',gear:'Gear',tourneys:'Tournament'}[type]);fields.innerHTML=schema[type].map(([k,l,t])=>t=='lake'?`<div class="field"><label>${l}</label><select data-k="${k}">${lakes.map(x=>`<option ${x[0]==lake[0]?'selected':''}>${x[0]}</option>`).join('')}</select></div>`:t=='date'?`<div class="field"><label>${l}</label><input type="date" data-k="${k}" value="${new Date().toISOString().slice(0,10)}"></div>`:t=='file'?`<div class="field"><label>${l}</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="prev" class="photoPrev"></div>`:`<div class="field"><label>${l}</label><input data-k="${k}" placeholder="${t}"></div>`).join('');modal.classList.add('open');let p=document.getElementById('photo');if(p)p.onchange=ev=>compress(ev.target.files[0])}function compress(file){if(!file)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,1200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*sc;cv.height=im.height*sc;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pic=cv.toDataURL('image/jpeg',.7);prev.src=pic;prev.style.display='block'};im.src=r.result};r.readAsDataURL(file)}function closeForm(){modal.classList.remove('open');form=null;pic=''}function saveForm(){if(!form)return;let o={id:Date.now()};document.querySelectorAll('#fields [data-k]').forEach(x=>o[x.dataset.k]=x.value.trim());if(form=='catches'){o.photo=pic;o.weather=weather}data[form].unshift(o);save();closeForm()}render();</script></body></html>
