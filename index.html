<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>PittCo Fishing</title><style>html,body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.mark{font-size:26px;font-weight:1000}.mark span{color:#a52bff}.muted{color:#aaa8b4;font-size:12px;margin-top:8px}</style></head><body><div id="boot"><div><div class="mark">PITTCO <span>FISHING</span></div><div class="muted">Loading your fishing operating system…</div></div></div><script>
const RAW='https://raw.githubusercontent.com/elitearcher70-art/pittco-fishing/main/';
const ALLOWED=['release-home.html','legacy.html','lake-directory.html','community.html','settings.html','profile.html','more.html','more-v2.html','merch.html','help.html'];
function routeParts(h){h=h||'release-home.html';if(h==='/'||h==='index.html'||h==='index')h='release-home.html';let hash=h.includes('#')?'#'+h.split('#').slice(1).join('#'):'';let base=h.split('#')[0],search=base.includes('?')?'?'+base.split('?').slice(1).join('?'):'',file=base.split('?')[0].replace(/^\.\//,'').replace(/^\//,'');if(!ALLOWED.includes(file))file='release-home.html';return{file,search,hash,route:file+search+hash}}
function makePrelude(route){const p=routeParts(route);return `<script>(function(){const RAW=${JSON.stringify(RAW)},ALLOWED=${JSON.stringify(ALLOWED)},ROUTE=${JSON.stringify(p.route)},SEARCH=${JSON.stringify(p.search)},HASH=${JSON.stringify(p.hash)};window.__PITTCO_ROUTE_SEARCH=SEARCH;window.__PITTCO_ROUTE=ROUTE;const nativeFetch=window.fetch.bind(window);window.fetch=function(input,init){let u=typeof input==='string'?input:(input&&input.url)||'';if(u==='/data/lakes.json'||u==='data/lakes.json')return nativeFetch(RAW+'data/lakes.json',{...(init||{}),cache:'no-store'});if(u==='/data/app-config.json'||u==='data/app-config.json')return nativeFetch(RAW+'data/app-config.json',{...(init||{}),cache:'no-store'});return nativeFetch(input,init)};document.addEventListener('click',function(e){let a=e.target.closest&&e.target.closest('a[href]');if(!a)return;let href=a.getAttribute('href')||'';let bare=href.split('?')[0].split('#')[0].replace(/^\\.\\//,'').replace(/^\\//,'');if(href==='/'||ALLOWED.includes(bare)){e.preventDefault();sessionStorage.setItem('pittco-route',href==='/'?'release-home.html':href);location.reload()}},true);if(HASH)setTimeout(function(){let id=HASH.slice(1);if(typeof window.go==='function'&&['catches','trips','gear','tourneys','lakes'].includes(id))window.go(id)},120)})();<\/script>`}
async function upgradeLegacy(html,p){try{let j=await fetch(RAW+'data/lakes.json?v=20260819d',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),a=j.lakes||[];if(!a.length)return html;let requested=new URLSearchParams(p.search).get('lake')||'',home='';try{home=JSON.parse(localStorage.getItem('pittco-user-settings-v1')||'{}').homeLake||JSON.parse(localStorage.getItem('pittco-home-lake')||'{}').id||''}catch{}let focus=requested||home,counts={};a.forEach(x=>counts[x.name]=(counts[x.name]||0)+1);a=[...a].sort((x,y)=>(x.id===focus?-1:y.id===focus?1:0));let tuples=a.map(x=>[counts[x.name]>1?`${x.name} (${x.state})`:x.name,x.lat,x.lon,x.state,x.id]);const old="const KEY='pittco-v4',lakes=[['Sardis Lake',34.6443,-95.3694],['McGee Creek Reservoir',34.3245,-95.8753],['Lake Eufaula',35.2873,-95.5822],['Broken Bow Lake',34.1401,-94.6948]];let data=";html=html.replace(old,"const KEY='pittco-v4',lakes="+JSON.stringify(tuples)+";let data=");html=html.split('<div class=\"muted\">Oklahoma</div>').join('<div class=\"muted\">${e(x[3]||\"U.S.\")}</div>');return html}catch{return html}}
async function load(route){let p=routeParts(route),r=await fetch(RAW+p.file+'?v=20260819d',{cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status);let html=await r.text();if(p.file==='legacy.html')html=await upgradeLegacy(html,p);if(p.file==='lake-directory.html')html=html.replace('location.href=`/legacy.html#lakes`','location.href=`/legacy.html?lake=${encodeURIComponent(selected.id)}#lakes`');html=html.replace(/<head([^>]*)>/i,'<head$1>'+makePrelude(p.route));document.open();document.write(html);document.close()}
let qp=new URLSearchParams(location.search).get('route'),path=location.pathname.replace(/^\//,'');let initial=sessionStorage.getItem('pittco-route')||qp||(path&&path!=='index.html'?path+location.search+location.hash:'release-home.html');sessionStorage.removeItem('pittco-route');load(initial).catch(e=>{document.getElementById('boot').innerHTML='<div><div class="mark">PITTCO <span>FISHING</span></div><div class="muted">Unable to load the app. Check your connection and refresh.</div></div>';console.error(e)});
</script></body></html>
