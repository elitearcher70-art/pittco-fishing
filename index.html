fig.json')return nf(RAW+'data/app-config.json?v=13',{...(init||{}),cache:'no-store'});return nf(input,init)};function brand(){if(!document.getElementById('pittco-brand-css')){let s=document.createElement('style');s.id='pittco-brand-css';s.textContent='.pittcoBrandLogo{display:block;width:118px;max-height:72px;object-fit:contain;margin:auto;filter:drop-shadow(0 7px 14px #000b)}';document.head.appendChild(s)}document.querySelectorAll('.brand').forEach(el=>{if(!el.querySelector('img'))el.innerHTML='<img class=\"pittcoBrandLogo\" src=\"'+LOGO+'\" alt=\"PittCo Fishing\">'})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',brand,{once:true});else brand();setTimeout(brand,60);document.addEventListener('click',function(e){let a=e.target.closest&&e.target.closest('a[href]');if(!a)return;let href=a.getAttribute('href')||'';if(href.startsWith('/?route='))return;let bare=href.split('?')[0].split('#')[0].replace(/^\.\//,'').replace(/^\//,'');if(href==='/'||ALLOWED.includes(bare)){e.preventDefault();location.href='/?route='+encodeURIComponent(href==='/'?HOME:href)}},true);if(HASH)setTimeout(()=>{let id=HASH.slice(1);if(typeof window.go==='function'&&['catches','trips','gear','tourneys','lakes'].includes(id))window.go(id)},140)})();<\/script>`}async function upgradeLegacy(html,p){try{let j=await fetch(RAW+'data/lakes.json?v=13',{cache:'no-store'}).then(r=>r.json()),a=j.lakes||[],home='';try{home=JSON.parse(localStorage.getItem('pittco-user-settings-v1')||'{}').homeLake||''}catch{}let focus=new URLSearchParams(p.search).get('lake')||home,counts={};a.forEach(x=>counts[x.name]=(counts[x.name]||0)+1);a=[...a].sort((x,y)=>(x.id===focus?-1:y.id===focus?1:0));let tuples=a.map(x=>[counts[x.name]>1?x.name+' ('+x.state+')':x.name,x.lat,x.lon,x.state,x.id]);const old="const KEY='pittco-v4',lakes=[['Sardis Lake',34.6443,-95.3694],['McGee Creek Reservoir',34.3245,-95.8753],['Lake Eufaula',35.2873,-95.5822],['Broken Bow Lake',34.1401,-94.6948]];let data=";html=html.replace(old,"const KEY='pittco-v4',lakes="+JSON.stringify(tuples)+";let data=")}catch{}let css='<style>body{background:radial-gradient(circle at 50% -8%,#25102e,#07070a 38%,#050507 72%)!important}.card{background:linear-gradient(145deg,#17131c,#09090d)!important;border-color:#34273d!important;border-radius:18px!important}.primary{background:linear-gradient(135deg,#b436ff,#7020bd)!important}.icon{border-radius:50%!important}.tabs{background:#060608f2!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important}.tab.active{color:#c54cff!important;background:#1a0d22!important}select,input,textarea{font-size:16px!important;border-radius:14px!important}</style>';return html.replace('</head>',css+'</head>')}async function load(route){let p=parts(route),r=await fetch(RAW+p.file+'?v=20260819-live13',{cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status);let html=await r.text();if(p.file==='legacy.html')html=await upgradeLegacy(html,p);html=html.replace(/<head([^>]*)>/i,'<head$1>'+prelude(p.route));document.open();document.write(html);document.close()}let qp=new URLSearchParams(location.search).get('route'),path=location.pathname.replace(/^\//,'');let initial=qp||(path&&path!=='index.html'?path+location.search+location.hash:HOME);load(initial).catch(e=>{document.getElementById('boot').innerHTML='<div><div class=\"bootMark\">PITTCO <span>FISHING</span></div><div class=\"muted\">Unable to load PittCo. Refresh and try again.</div></div>';console.error(e)});</script></body></html>
