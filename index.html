tch.bind(window);window.fetch=function(input,init){let u=typeof input==='string'?input:(input&&input.url)||'';if(u==='/data/lakes.json'||u==='data/lakes.json')return nativeFetch(RAW+'data/lakes.json',{...(init||{}),cache:'no-store'});if(u==='/data/app-config.json'||u==='data/app-config.json')return nativeFetch(RAW+'data/app-config.json',{...(init||{}),cache:'no-store'});return nativeFetch(input,init)};function brandify(){if(!document.getElementById('pittco-logo-style')){let st=document.createElement('style');st.id='pittco-logo-style';st.textContent='.pittcoBrandLogo{display:block;width:116px;max-height:62px;object-fit:contain;filter:drop-shadow(0 7px 14px #0009);mix-blend-mode:screen}.pittcoHeroLogo{display:block;width:min(94%,430px);height:auto;margin:-20px auto 6px;filter:drop-shadow(0 18px 34px #000b);mix-blend-mode:screen}@media(max-width:420px){.pittcoBrandLogo{width:98px;max-height:54px}.pittcoHeroLogo{width:100%;margin-top:-12px}}';document.head.appendChild(st)}document.querySelectorAll('.brand').forEach(function(el){if(el.querySelector('.pittcoBrandLogo'))return;el.innerHTML='<img class=\"pittcoBrandLogo\" src=\"'+LOGO+'\" alt=\"PittCo Fishing\">'});if(ROUTE.split(/[?#]/)[0]==='release-home.html'){let hero=document.querySelector('.hero');if(hero&&!hero.querySelector('.logo,.pittcoHeroLogo')){let img=document.createElement('img');img.className='pittcoHeroLogo';img.src=LOGO;img.alt='PittCo Fishing';hero.insertBefore(img,hero.firstChild)}}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',brandify,{once:true});else brandify();setTimeout(brandify,80);document.addEventListener('click',function(e){let a=e.target.closest&&e.target.closest('a[href]');if(!a)return;let href=a.getAttribute('href')||'';let bare=href.split('?')[0].split('#')[0].replace(/^\\.\\//,'').replace(/^\\//,'');if(href==='/'||ALLOWED.includes(bare)){e.preventDefault();sessionStorage.setItem('pittco-route',href==='/'?'release-home.html':href);location.reload()}},true);if(HASH)setTimeout(function(){let id=HASH.slice(1);if(typeof window.go==='function'&&['catches','trips','gear','tourneys','lakes'].includes(id))window.go(id)},120)})();<\/script>`}async function upgradeLegacy(html,p){try{let j=await fetch(RAW+'data/lakes.json?v=20260819-mockup3',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),a=j.lakes||[];if(!a.length)return html;let requested=new URLSearchParams(p.search).get('lake')||'',home='';try{home=JSON.parse(localStorage.getItem('pittco-user-settings-v1')||'{}').homeLake||JSON.parse(localStorage.getItem('pittco-home-lake')||'{}').id||''}catch{}let focus=requested||home,counts={};a.forEach(x=>counts[x.name]=(counts[x.name]||0)+1);a=[...a].sort((x,y)=>(x.id===focus?-1:y.id===focus?1:0));let tuples=a.map(x=>[counts[x.name]>1?`${x.name} (${x.state})`:x.name,x.lat,x.lon,x.state,x.id]);const old="const KEY='pittco-v4',lakes=[['Sardis Lake',34.6443,-95.3694],['McGee Creek Reservoir',34.3245,-95.8753],['Lake Eufaula',35.2873,-95.5822],['Broken Bow Lake',34.1401,-94.6948]];let data=";html=html.replace(old,"const KEY='pittco-v4',lakes="+JSON.stringify(tuples)+";let data=");html=html.split('<div class=\"muted\">Oklahoma</div>').join('<div class=\"muted\">${e(x[3]||\"U.S.\")}</div>');return html}catch{return html}}async function load(route){let p=routeParts(route),r=await fetch(RAW+p.file+'?v=20260819-mockup3',{cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status);let html=await r.text();if(p.file==='legacy.html')html=await upgradeLegacy(html,p);if(p.file==='lake-directory.html')html=html.replace('location.href=`/legacy.html#lakes`','location.href=`/legacy.html?lake=${encodeURIComponent(selected.id)}#lakes`');html=html.replace(/<head([^>]*)>/i,'<head$1>'+makePrelude(p.route));document.open();document.write(html);document.close()}let qp=new URLSearchParams(location.search).get('route'),path=location.pathname.replace(/^\//,'');let initial=sessionStorage.getItem('pittco-route')||qp||(path&&path!=='index.html'?path+location.search+location.hash:'release-home.html');sessionStorage.removeItem('pittco-route');load(initial).catch(e=>{document.getElementById('boot').innerHTML='<div><img class=\"bootLogo\" src=\"'+LOGO+'\" alt=\"PittCo Fishing\"><div class=\"muted\">Unable to load the app. Check your connection and refresh.</div></div>';console.error(e)});</script></body></html>
