<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>PittCo Fishing — Lake Master Catalog</title><style>:root{--p:#a82cff;--muted:#aaa5b2;--bg:#050507}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:820px;margin:auto;padding:14px 13px 92px}.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}.icon{width:38px;height:38px;border:1px solid #392a43;background:#0b0b10;color:#fff;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:18px}.brand{text-align:center;font-weight:950;font-size:14px}.brand span{color:var(--p)}.hero{padding:16px 2px 11px}.hero h1{font-size:27px;line-height:1;margin:0 0 7px}.hero p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.tabs{display:flex;gap:3px;overflow:auto;border-bottom:1px solid #29232e;scrollbar-width:none}.chip{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:transparent;color:#aaa5b2;padding:9px 10px;font-size:9px;font-weight:900}.chip.on{color:#d670ff;border-color:#bc37ff}.filters{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:7px;margin:11px 0 8px}input,select{width:100%;background:#0b0b10;color:#fff;border:1px solid #3a2a42;border-radius:12px;padding:10px 11px;font:inherit;font-size:16px;outline:none}.actionsTop{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}.btn{border:0;border-radius:10px;padding:8px 10px;font-weight:900;font-size:9px;min-height:34px}.primary{background:linear-gradient(135deg,#b436ff,#7020bd);color:#fff}.secondary{background:#101016;color:#fff;border:1px solid #34303a}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:9px;margin:8px 2px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{position:relative;min-height:164px;border:1px solid #43354d;border-radius:15px;overflow:hidden;padding:11px;background:linear-gradient(160deg,#18222b,#10141a 43%,#09090d 78%);box-shadow:0 13px 30px #0006}.stateLine{color:#d770ff;font-size:7px;font-weight:950;text-transform:uppercase;letter-spacing:.08em}.card h3{font-size:15px;line-height:1.05;margin:6px 31px 5px 0}.sub{font-size:8px;color:#cac5ce;line-height:1.4}.tag{display:inline-block;margin-top:7px;border:1px solid #4a3c55;border-radius:999px;padding:4px 6px;font-size:7px;color:#d5cfd9;background:#0b0b1099}.homeTag{border-color:#8e3cb2;color:#e7baff}.fav{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:50%;border:1px solid #4a414f;background:#08080cd9;color:#8d8790;font-size:16px}.fav.on{color:#d343ff;border-color:#983bc2}.distance{margin-top:6px;color:#cdb5da;font-size:8px}.cardActions{position:absolute;left:9px;right:9px;bottom:9px;display:grid;grid-template-columns:1.2fr .8fr;gap:5px}.empty{grid-column:1/-1;text-align:center;padding:42px 12px;border:1px dashed #493452;border-radius:15px;color:var(--muted);font-size:11px}.nav{position:fixed;z-index:40;left:0;right:0;bottom:0;background:#060608f4;border-top:1px solid #29242e;padding:5px 6px calc(5px + env(safe-area-inset-bottom));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.navin{max-width:820px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;align-items:center}.nav a{color:#aaa5ad;text-decoration:none;text-align:center;font-size:8px}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}.nav .on{color:#c54cff}.nav .plus{width:47px;height:47px;border-radius:50%;background:linear-gradient(145deg,#bd36ff,#7020bd);display:grid;place-items:center;margin:-20px auto 0;color:#fff;font-size:31px}@media(max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}}@media(max-width:370px){.grid{grid-template-columns:1fr}.card{min-height:154px}}</style></head><body><main class="app"><div class="top"><a class="icon" href="/">‹</a><div class="brand">PITTCO <span>LAKES</span></div><a class="icon" href="/?route=more.html">☰</a></div><section class="hero"><h1>Lake Master Catalog</h1><p>Search major fisheries across the U.S., filter by state or region, save favorites, find nearby water, and open each lake's full PittCo profile.</p></section><div class="tabs"><button class="chip on" data-tier="">Explore</button><button class="chip" data-tier="favorites">Favorites</button><button class="chip" data-tier="national">National</button><button class="chip" data-tier="priority">Priority</button><button class="chip" data-tier="regional">Regional</button></div><div class="filters"><input id="q" type="search" placeholder="Search lakes, states, regions…" autocomplete="off"><select id="state"><option value="">All states</option></select><select id="region"><option value="">All regions</option></select></div><div class="actionsTop"><button class="btn primary" id="nearby">⌖ Nearby lakes</button><button class="btn secondary" id="clearLocation" style="display:none">Clear distance</button><button class="btn secondary" id="reset">Reset filters</button></div><div class="meta"><span id="count">Loading lakes…</span><span id="locationStatus"></span></div><section class="grid" id="grid"><div class="empty">Loading nationwide lake catalog…</div></section></main><nav class="nav"><div class="navin"><a href="/"><i>⌂</i>Home</a><a class="on" href="/?route=lake-directory.html"><i>⌖</i>Lakes</a><a href="/?route=legacy.html%23catches"><span class="plus">＋</span></a><a href="/?route=community.html"><i>◎</i>Community</a><a href="/?route=more.html"><i>☰</i>More</a></div></nav><script>(function(){'use strict';var RAW='https://raw.githubusercontent.com/elitearcher70-art/pittco-fishing/main/data/lakes.json?v=master-20260825';var catalog=[],tier='',coords=null;var FAV='pittco-favorite-lakes',SETTINGS='pittco-user-settings-v1';function $(id){return document.getElementById(id)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch(e){return f}}function favs(){return read(FAV,[])}function saveFavs(v){localStorage.setItem(FAV,JSON.stringify(v))}function home(){return read(SETTINGS,{}).homeLake||''}function states(v){return String(v||'').split('/').map(function(x){return x.trim()}).filter(Boolean)}function route(file,id){return '/?route='+encodeURIComponent(file+'?lake='+id)}function miles(a,b,c,d){var r=3958.8,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,k=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*r*Math.asin(Math.sqrt(k))}function render(){var q=$('q').value.trim().toLowerCase(),reg=$('region').value,st=$('state').value,fs=favs(),hm=home(),a=catalog.filter(function(x){var ok=!q||[x.name,x.state,x.region].join(' ').toLowerCase().indexOf(q)>=0;ok=ok&&(!reg||x.region===reg)&&(!st||states(x.state).indexOf(st)>=0);if(tier==='favorites')ok=ok&&fs.indexOf(x.id)>=0;else if(tier)ok=ok&&x.tier===tier;return ok});if(coords)a=a.map(function(x){var y={};Object.keys(x).forEach(function(k){y[k]=x[k]});y.distance=miles(coords.lat,coords.lon,x.lat,x.lon);return y}).sort(function(a,b){return a.distance-b.distance});$('count').textContent=a.length+' '+(a.length===1?'lake':'lakes')+' • '+catalog.length+' total';$('grid').innerHTML=a.length?a.map(function(x){return '<article class="card"><button class="fav '+(fs.indexOf(x.id)>=0?'on':'')+'" data-fav="'+esc(x.id)+'">♡</button><div class="stateLine">'+esc(x.state)+' • '+esc(x.region)+'</div><h3>'+esc(x.name)+'</h3><div class="sub">'+(x.tier==='national'?'National tournament fishery':x.tier==='priority'?'Priority bass fishery':'Regional bass fishery')+'</div>'+(coords?'<div class="distance">'+x.distance.toFixed(0)+' mi away</div>':'')+'<span class="tag '+(hm===x.id?'homeTag':'')+'">'+(hm===x.id?'⌂ Home Lake':'Lake Profile')+'</span><div class="cardActions"><button class="btn primary" data-profile="'+esc(x.id)+'">Profile</button><button class="btn secondary" data-map="'+esc(x.id)+'">Map</button></div></article>'}).join(''):'<div class="empty">No lakes match those filters.</div>';Array.prototype.forEach.call(document.querySelectorAll('[data-fav]'),function(b){b.onclick=function(){var f=favs(),i=f.indexOf(b.dataset.fav);if(i>=0)f.splice(i,1);else f.push(b.dataset.fav);saveFavs(f);render()}});Array.prototype.forEach.call(document.querySelectorAll('[data-profile]'),function(b){b.onclick=function(){location.href=route('lake-profile.html',b.dataset.profile)}});Array.prototype.forEach.call(document.querySelectorAll('[data-map]'),function(b){b.onclick=function(){location.href=route('map.html',b.dataset.map)}})}function filters(){var regs=[],sts=[];catalog.forEach(function(x){if(regs.indexOf(x.region)<0)regs.push(x.region);states(x.state).forEach(function(s){if(sts.indexOf(s)<0)sts.push(s)})});regs.sort();sts.sort();$('region').innerHTML='<option value="">All regions</option>'+regs.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');$('state').innerHTML='<option value="">All states</option>'+sts.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')}async function load(){try{var r=await fetch(RAW,{cache:'no-store'});if(!r.ok)throw Error(r.status);var j=await r.json();catalog=j.lakes||[];if(!catalog.length)throw Error('empty');filters();render()}catch(e){$('count').textContent='Catalog unavailable';$('grid').innerHTML='<div class="empty">Lake catalog could not be loaded. Please retry.</div>'}}function reset(){$('q').value='';$('state').value='';$('region').value='';tier='';Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'),function(b,i){b.classList.toggle('on',i===0)});render()}$('q').addEventListener('input',render);$('state').addEventListener('change',render);$('region').addEventListener('change',render);Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'),function(b){b.onclick=function(){tier=b.dataset.tier;Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'),function(x){x.classList.toggle('on',x===b)});render()}});$('reset').onclick=reset;$('nearby').onclick=function(){if(!navigator.geolocation){$('locationStatus').textContent='Location unavailable';return}$('locationStatus').textContent='Locating…';navigator.geolocation.getCurrentPosition(function(p){coords={lat:p.coords.latitude,lon:p.coords.longitude};$('locationStatus').textContent='Nearest first';$('clearLocation').style.display='inline-block';render()},function(){$('locationStatus').textContent='Location permission not granted'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})};$('clearLocation').onclick=function(){coords=null;$('locationStatus').textContent='';$('clearLocation').style.display='none';render()};load()})();</script></body></html>
