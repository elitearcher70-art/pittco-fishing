<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#040406"><title>PittCo Fishing</title><style>html,body{margin:0;background:#040406;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center}.mark{font-size:28px;font-weight:950}.mark span{color:#a427ff}.sub{font-size:12px;color:#aaa5b2;margin-top:8px}</style></head><body><div id="boot"><div><div class="mark">PITTCO <span>FISHING</span></div><div class="sub">Loading lake data…</div></div></div><script>
const RAW='https://raw.githubusercontent.com/elitearcher70-art/pittco-fishing/main/';
const HOME='home-v3.html';
const ALLOWED=[HOME,'legacy.html','lake-directory.html','lake-profile.html','community.html','settings.html','profile.html','more.html','more-v2.html','merch.html','help.html','weather.html','map.html'];
const USACE=new Set(['ok-sardis','ok-eufaula','ok-broken-bow','ok-tenkiller']);
const AUTH={'ok-grand':{label:'GRDA River Operations',url:'https://stormops.grda.com/riveroperations'},'ok-hudson':{label:'GRDA River Operations',url:'https://stormops.grda.com/riveroperations'},'ok-mcgee-creek':{label:'Bureau of Reclamation',url:'https://www.usbr.gov/projects/index.php?id=351'}};
function route(v){v=decodeURIComponent(v||HOME);let hash=v.includes('#')?'#'+v.split('#').slice(1).join('#'):'',pre=v.split('#')[0],search=pre.includes('?')?'?'+pre.split('?').slice(1).join('?'):'',file=pre.split('?')[0].replace(/^\.\//,'').replace(/^\//,'');if(!ALLOWED.includes(file))file=HOME;return{file,search,hash}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stat(label,value,cls=''){if(value==null||value==='')return'';return '<div class="stat"><b class="'+cls+'">'+esc(value)+'</b><small>'+esc(label)+'</small></div>'}
function fmt(n,d=0){const x=Number(n);return Number.isFinite(x)?x.toLocaleString(undefined,{maximumFractionDigits:d}):'—'}
function tierName(v){return v==='national'?'National tournament fishery':v==='priority'?'Priority bass fishery':'Regional fishery'}
function rewriteLinks(h){return h.replaceAll('href="home-v3.html"','href="/"').replaceAll('href="lake-directory.html"','href="/?route=lake-directory.html"').replaceAll('href="community.html"','href="/?route=community.html"').replaceAll('href="profile.html"','href="/?route=profile.html"').replaceAll('href="settings.html"','href="/?route=settings.html"').replaceAll('href="more.html"','href="/?route=more.html"').replaceAll('href="legacy.html#catches"','href="/?route=legacy.html%23catches"').replaceAll('href="legacy.html#trips"','href="/?route=legacy.html%23trips"').replaceAll('href="legacy.html#gear"','href="/?route=legacy.html%23gear"').replaceAll('href="legacy.html#tourneys"','href="/?route=legacy.html%23tourneys"').replaceAll('href="legacy.html#lakes"','href="/?route=map.html"').replaceAll('href="legacy.html"','href="/?route=legacy.html"')}
function rewriteFetches(h){return h.replaceAll("fetch('/data/lakes.json'","fetch('"+RAW+"data/lakes.json'").replaceAll('fetch(\"/data/lakes.json\"','fetch(\"'+RAW+'data/lakes.json\"').replaceAll("fetch('/data/app-config.json'","fetch('"+RAW+"data/app-config.json'")}
async function getJSON(url,opts={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch(url,Object.assign({cache:'no-store'},opts,{signal:c.signal}));if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(t)}}
async function weather(x){try{const j=await getJSON('/api/weather?lat='+encodeURIComponent(x.lat)+'&lon='+encodeURIComponent(x.lon)),c=j.current||{},p=Number(c.surface_pressure)*.02953,w=Number(c.weather_code),cond=w===0?'Sunny':w<=3?'Partly cloudy':w<=48?'Fog':w<=67?'Rain':w<=82?'Showers':'Storms';return{html:stat('Condition',cond+' • '+Math.round(c.temperature_2m)+'°','good')+stat('Feels like',Math.round(c.apparent_temperature)+'°')+stat('Wind',Math.round(c.wind_speed_10m||0)+' mph')+stat('Humidity',Math.round(c.relative_humidity_2m||0)+'%')+stat('Pressure',Number.isFinite(p)?p.toFixed(2)+' inHg':'—'),data:{wind:Number(c.wind_speed_10m),pressure:p,code:w,temp:Number(c.temperature_2m)}}}catch(e){return{html:stat('Live weather','Temporarily unavailable','warn'),data:{}}}}
async function dam(id,d){let h='';if(d.dam_name)h+=stat('Dam',d.dam_name);if(d.normal_pool_ft!=null)h+=stat('Normal / conservation pool',fmt(d.normal_pool_ft,2)+' ft');if(USACE.has(id)){try{const j=await getJSON('/api/usace?lake='+encodeURIComponent(id));if(j.currentLakeLevelFt!=null)h+=stat('Current lake level',fmt(j.currentLakeLevelFt,2)+' ft','good');if(j.feetFromNormal!=null)h+=stat('Vs normal pool',(Number(j.feetFromNormal)>=0?'+':'')+fmt(j.feetFromNormal,2)+' ft');if(j.change24hFt!=null)h+=stat('24-hour change',(Number(j.change24hFt)>=0?'↑ ':'↓ ')+fmt(Math.abs(j.change24hFt),2)+' ft');if(j.releaseStatus)h+=stat('Water release',j.releaseStatus,j.releaseStatus==='RELEASING WATER'?'good':'');if(j.releaseCfs!=null)h+=stat('Release flow',fmt(j.releaseCfs)+' cfs');if(j.inflowCfs!=null)h+=stat('Inflow',fmt(j.inflowCfs)+' cfs');if(j.gateStatus)h+=stat('Gate / spillway position',j.gateStatus,/open/i.test(j.gateStatus)?'good':'');return{html:h,note:(j.source||'USACE')+(j.observedAtDisplay?' • Updated '+j.observedAtDisplay:'')+'. Official agency data pulled through PittCo.',data:j}}catch(e){h+=stat('Live water','Temporarily unavailable','warn');return{html:h,note:'Official USACE water data is temporarily unavailable.',data:{}}}}if(AUTH[id])h+=stat('Live operations','Use official operations source below','warn');else if(!h)h+=stat('Dam / operations','No verified live operations feed yet','warn');return{html:h,note:'Live operations are only shown when PittCo has an authoritative agency source.',data:{}}}
async function renderProfile(raw,p){const doc=new DOMParser().parseFromString(raw,'text/html');doc.querySelectorAll('script').forEach(s=>s.remove());const id=new URLSearchParams(p.search).get('lake');let lakeDoc,intelDoc,bathyDoc={};try{[lakeDoc,intelDoc,bathyDoc]=await Promise.all([getJSON(RAW+'data/lakes.json?v=nationwide-profile1'),getJSON(RAW+'data/lake-intel.json?v=nationwide-profile1'),getJSON(RAW+'data/ok-bathymetry.json?v=nationwide-profile1').catch(()=>({}))])}catch(e){doc.getElementById('name').textContent='Lake profile unavailable';doc.getElementById('region').textContent='Lake catalog could not be loaded.';return '<!doctype html>'+doc.documentElement.outerHTML}const lakes=lakeDoc.lakes||[],x=lakes.find(v=>v.id===id)||lakes[0],intel=(intelDoc.lakes||{}),d=intel[x.id]||{},b=(bathyDoc.lakes||{})[x.id]||{};doc.getElementById('name').textContent=x.name;doc.getElementById('state').textContent=x.state+' • LAKE PROFILE';doc.getElementById('region').textContent=x.region+' • '+tierName(x.tier)+' • PittCo nationwide catalog';let specs='';specs+=stat('Region',x.region);specs+=stat('Fishery class',tierName(x.tier));specs+=stat('Latitude',Number(x.lat).toFixed(4));specs+=stat('Longitude',Number(x.lon).toFixed(4));if(d.surface_acres!=null)specs+=stat('Surface area',fmt(d.surface_acres)+' ac');if(d.shoreline_miles!=null)specs+=stat('Shoreline',fmt(d.shoreline_miles,1)+' mi');if(d.max_depth_ft!=null)specs+=stat('Max depth',fmt(d.max_depth_ft,1)+' ft');if(d.mean_depth_ft!=null)specs+=stat('Mean depth',fmt(d.mean_depth_ft,1)+' ft');if(d.normal_pool_ft!=null)specs+=stat('Normal / conservation pool',fmt(d.normal_pool_ft,2)+' ft');if(d.volume_acre_ft!=null)specs+=stat('Volume / storage',fmt(d.volume_acre_ft)+' ac-ft');else if(d.storage_acre_ft!=null)specs+=stat('Volume / storage',fmt(d.storage_acre_ft)+' ac-ft');if(d.dam_height_ft!=null)specs+=stat('Dam height',fmt(d.dam_height_ft)+' ft');doc.getElementById('specGrid').innerHTML=specs;let details='<div class="section"><strong>Profile coverage</strong><p>'+(Object.keys(d).length?'Verified lake intelligence is available for this lake; unsourced fields are intentionally omitted.':'Catalog baseline is available now. Detailed acreage, depth, dam, fish and regulation fields will appear only after an authoritative source is verified.')+'</p></div>';details+='<div class="section"><strong>Managing agency</strong><p>'+esc(d.manager||'Not yet verified')+'</p></div>';if(d.dam_name)details+='<div class="section"><strong>Dam</strong><p>'+esc(d.dam_name)+'</p></div>';if(d.counties&&d.counties.length)details+='<div class="section"><strong>Counties</strong><p>'+esc(d.counties.join(', '))+'</p></div>';details+='<div class="section"><strong>Depth / bathymetry</strong><p class="'+(b.status==='available'?'good':'')+'">'+(b.status==='available'?'Verified public depth contours available':'Verified public depth-contour coverage has not yet been confirmed for this lake.')+'</p></div>';if(d.fish&&d.fish.length)details+='<div class="section"><strong>Key fish</strong><div class="chips">'+d.fish.map(v=>'<span class="chip">'+esc(v)+'</span>').join('')+'</div></div>';if(d.facilities&&d.facilities.length)details+='<div class="section"><strong>Access & facilities</strong><div class="chips">'+d.facilities.map(v=>'<span class="chip">'+esc(v)+'</span>').join('')+'</div></div>';if(d.regulation_note)details+='<div class="section"><strong>Regulations</strong><p>'+esc(d.regulation_note)+'</p></div>';if(d.dam_note)details+='<div class="section"><strong>Dam notes</strong><p>'+esc(d.dam_note)+'</p></div>';if(d.angler_note)details+='<div class="section"><strong>Angler notes</strong><p>'+esc(d.angler_note)+'</p></div>';if(d.source_label)details+='<div class="section"><strong>Verified source</strong><p>'+esc(d.source_label)+'</p></div>';doc.getElementById('details').innerHTML=details;const map='/?route='+encodeURIComponent('map.html?lake='+x.id),wxRoute='/?route='+encodeURIComponent('weather.html?lake='+x.id);doc.getElementById('mapNav').href=map;doc.getElementById('wxNav').href=wxRoute;let links='<a class="primary" href="'+map+'">Map + Depth + Ramps</a><a href="'+wxRoute+'">Full Forecast</a>';if(d.official_report_url)links+='<a href="'+esc(d.official_report_url)+'" target="_blank" rel="noopener">Official Fishing Profile ↗</a>';if(d.live_water_url)links+='<a href="'+esc(d.live_water_url)+'" target="_blank" rel="noopener">Official Water ↗</a>';if(AUTH[x.id])links+='<a href="'+esc(AUTH[x.id].url)+'" target="_blank" rel="noopener">'+esc(AUTH[x.id].label)+' ↗</a>';doc.getElementById('links').innerHTML=links;const [damInfo,wxInfo]=await Promise.all([dam(x.id,d),weather(x)]);doc.getElementById('damGrid').innerHTML=damInfo.html;doc.getElementById('damNote').textContent=damInfo.note;doc.getElementById('weatherGrid').innerHTML=wxInfo.html;doc.getElementById('ramps').innerHTML='<p class="note">Open Map + Depth + Ramps for mapped public access records around '+esc(x.name)+'.</p>';doc.head.insertAdjacentHTML('beforeend','<link rel="stylesheet" href="'+RAW+'ui-polish-v2.css?v=2">');doc.body.insertAdjacentHTML('beforeend','<script src="'+RAW+'lake-command-center-v1.js?v=2"><\/script><script src="'+RAW+'lake-command-center-ui-v2.js?v=2"><\/script><script>window.addEventListener("load",function(){if(window.PittCoLakeCommandUI){window.PittCoLakeCommandUI.setLake('+JSON.stringify(x)+');window.PittCoLakeCommandUI.setWeather('+JSON.stringify(wxInfo.data||{})+');window.PittCoLakeCommandUI.setUsace('+JSON.stringify(damInfo.data||{})+')}});<\/script>');return '<!doctype html>'+doc.documentElement.outerHTML}
async function load(){const rp=new URLSearchParams(location.search).get('route'),p=route(rp||HOME);try{const r=await fetch(RAW+p.file+'?v=router-v2-2',{cache:'no-store'});if(!r.ok)throw Error(r.status);let h=await r.text();h=rewriteFetches(rewriteLinks(h));if(p.file==='lake-profile.html')h=await renderProfile(h,p);else{const payload=JSON.stringify({search:p.search,hash:p.hash});h=h.replace(/<head([^>]*)>/i,'<head$1><script>window.__PITTCO_ROUTE='+payload+';window.__PITTCO_ROUTE_SEARCH=window.__PITTCO_ROUTE.search;window.__PITTCO_ROUTE_HASH=window.__PITTCO_ROUTE.hash;<\/script>');if(p.file===HOME)h=h.replace('</head>','<link rel="stylesheet" href="'+RAW+'ui-polish-v2.css?v=2"></head>');if(p.file==='map.html')h=h.replace('</body>','<script src="'+RAW+'map-depth-providers-v3.js?v=4"><\/script><script src="'+RAW+'map-bathymetry-assets-v1.js?v=3"><\/script><script src="'+RAW+'ok-depth-coverage-v1.js?v=1"><\/script></body>');if(p.file==='lake-directory.html')h=h.replace('</body>','<script src="'+RAW+'ok-depth-coverage-v1.js?v=1"><\/script></body>')}document.open();document.write(h);document.close();if(p.hash){let id=p.hash.slice(1),n=0,t=setInterval(()=>{n++;if(typeof window.go==='function'){clearInterval(t);window.go(id)}else if(n>20)clearInterval(t)},50)}}catch(e){document.getElementById('boot').innerHTML='<div><div class="mark">PITTCO <span>FISHING</span></div><div class="sub">Unable to load PittCo. Refresh and try again.</div></div>';console.error(e)}}load();
</script></body></html>
